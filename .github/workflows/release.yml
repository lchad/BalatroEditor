name: Build and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Build macOS app (unpacked)
        run: npx electron-builder --mac --dir
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Ad-hoc sign the app bundle for macOS Gatekeeper
        run: |
          APP_PATH="dist/mac/Balatro Editor.app"
          if [ -d "$APP_PATH" ]; then
            echo "Ad-hoc signing $APP_PATH ..."
            codesign --force --deep --sign - "$APP_PATH"
            echo "Verifying signature:"
            codesign --verify --verbose=4 "$APP_PATH" 2>&1 || true
          else
            echo "WARNING: App bundle not found at $APP_PATH"
          fi

      - name: Package into DMG
        run: npx electron-builder --mac --prepackaged "dist/mac/Balatro Editor.app"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload .dmg to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.dmg

  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Build Windows .exe
        run: npx electron-builder --win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload .exe to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libfuse2 libxkbcommon0

      - name: Build Linux AppImage
        run: npx electron-builder --linux
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload AppImage to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.AppImage
